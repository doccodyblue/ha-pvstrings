<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#27476f"/>
      <stop offset="0.55" stop-color="#152744"/>
      <stop offset="1" stop-color="#0b1524"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.36" cy="0.30" r="0.78">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.42" stop-color="#ffd257"/>
      <stop offset="1" stop-color="#f5941a"/>
    </radialGradient>
    <linearGradient id="panelA" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#8ccdff"/>
      <stop offset="1" stop-color="#3184db"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#6cb8fa"/>
      <stop offset="1" stop-color="#2468c2"/>
    </linearGradient>
    <linearGradient id="panelC" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#559fee"/>
      <stop offset="1" stop-color="#1a52a3"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#sky)"/>

  <!-- the trajectory every forecast is built on -->
  <path d="M 30 178 Q 128 22 226 178" fill="none" stroke="#f7c65e"
        stroke-opacity="0.5" stroke-width="8" stroke-linecap="round"/>

  <circle cx="128" cy="98" r="40" fill="#ffb937" opacity="0.13"/>
  <circle cx="128" cy="98" r="26" fill="url(#sun)"/>

  <!-- three strings, three orientations: the whole point of the thing -->
  <g stroke="#09111d" stroke-width="6" stroke-linejoin="round">
    <g transform="translate(56 200) rotate(-19)">
      <path d="M -32 -15 L 32 -15 L 25 15 L -25 15 Z" fill="url(#panelA)"/>
      <path d="M 0 -15 L 0 15" stroke-width="5" stroke-opacity="0.5"/>
    </g>
    <g transform="translate(200 200) rotate(19)">
      <path d="M -32 -15 L 32 -15 L 25 15 L -25 15 Z" fill="url(#panelC)"/>
      <path d="M 0 -15 L 0 15" stroke-width="5" stroke-opacity="0.5"/>
    </g>
    <g transform="translate(128 208)">
      <path d="M -34 -16 L 34 -16 L 27 16 L -27 16 Z" fill="url(#panelB)"/>
      <path d="M 0 -16 L 0 16" stroke-width="5" stroke-opacity="0.5"/>
    </g>
  </g>
</svg>
